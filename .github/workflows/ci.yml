name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast Feedback & Policy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run fast verification gates (policy, migrations, lint, format, unit tests)
        run: npm run verify:fast

  full-verification:
    name: Full Verification, PostgreSQL Integration, Build & Security
    needs: fast-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: erp_platform_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci_test_password@127.0.0.1:5432/erp_platform_dev
      TEST_DATABASE_URL: postgresql://postgres:ci_test_password@127.0.0.1:5432/erp_platform_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Bootstrap & migrate dev and test PostgreSQL databases
        run: |
          npm run db:bootstrap
          npm run db:migrate
          npm run db:migrate:test

      - name: Run full verification suite (unit, API, DB integration, phase gates, production build)
        run: npm run verify:full

      - name: Dependency vulnerability check (high/critical)
        run: npm run audit:deps

      - name: Retain CI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
